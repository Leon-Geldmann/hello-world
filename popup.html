<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Price Converter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <style>
    :root {
      --md-primary: #6750A4;
      --md-on-primary: #FFFFFF;
      --md-surface: #FFFBFE;
      --md-on-surface: #1C1B1F;
      --md-surface-variant: #E7E0EC;
      --md-on-surface-variant: #49454F;
      --md-outline: #79747E;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --md-primary: #D0BCFF;
        --md-on-primary: #381E72;
        --md-surface: #1C1B1F;
        --md-on-surface: #E6E1E5;
        --md-surface-variant: #49454F;
        --md-on-surface-variant: #CAC4D0;
        --md-outline: #938F99;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 340px;
      background: var(--md-surface);
      color: var(--md-on-surface);
      font-family: 'Roboto', system-ui, sans-serif;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 8px 12px 16px;
      background: var(--md-primary);
      color: var(--md-on-primary);
    }

    .top-bar h1 {
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.15px;
    }

    .top-bar-actions { display: flex; gap: 4px; }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--md-on-primary);
      cursor: pointer;
      transition: background 0.2s;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.12); }
    .icon-btn .material-symbols-outlined { font-size: 22px; }

    .asset-list { padding: 8px; }

    .asset-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 4px;
      background: var(--md-surface-variant);
    }

    .asset-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .asset-info { flex: 1; min-width: 0; }

    .asset-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--md-on-surface-variant);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .asset-price {
      font-size: 16px;
      font-weight: 500;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px 12px;
      font-size: 12px;
      color: var(--md-on-surface-variant);
      border-top: 1px solid var(--md-outline);
      opacity: 0.8;
    }

    .status-msg {
      padding: 24px 16px;
      text-align: center;
      font-size: 14px;
      color: var(--md-on-surface-variant);
    }

    .empty-msg {
      padding: 16px;
      text-align: center;
      font-size: 13px;
      color: var(--md-on-surface-variant);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <h1>Price Converter</h1>
    <div class="top-bar-actions">
      <button class="icon-btn" id="refreshBtn" title="Refresh prices">
        <span class="material-symbols-outlined">refresh</span>
      </button>
      <button class="icon-btn" id="settingsBtn" title="Settings">
        <span class="material-symbols-outlined">settings</span>
      </button>
    </div>
  </div>

  <div id="assetList" class="asset-list">
    <div class="status-msg">Loading prices…</div>
  </div>

  <div class="footer" id="updateTime">Not yet updated</div>

  <script src="constants.js"></script>
  <script src="popup.js"></script>
</body>
</html>
